[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cisei-scenario-sdk"
version = "0.1.3.dev15"
description = "CISEI Scenario Builder SDK"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "tomlkit>=0.12",
    "PyYAML>=6.0",
    "pyproj",
    "openai",
    "ipython",
    "ipywidgets",
    "pandas",
]


[project.scripts]
cisei-scenario-install-notebooks = "cisei_scenario_sdk.install_notebooks:main"

[project.optional-dependencies]
planning = ["cisei-planning-sdk>=0.1.36,<0.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cisei_scenario_sdk = [
    "resources/references/*.md",
    "resources/notebooks/*.ipynb",
    "resources/examples/copel_palmeira/*.toml",
    "resources/examples/copel_palmeira/*.csv",
    "resources/examples/copel_palmeira/*.txt",
    "resources/examples/copel_palmeira/data/*.CSV",
]
