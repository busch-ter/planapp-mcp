[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cisei-scenario-sdk"
version = "0.1.0"
description = "CISEI Scenario Builder SDK"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "requests>=2.28",
    "tomlkit>=0.12",
    "PyYAML>=6.0",
    "pyproj",
]

[project.optional-dependencies]
notebook = [
    "ipython",
    "ipywidgets",
    "pandas",
    "cisei-planning-sdk==0.1.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cisei_scenario_sdk = [
    "resources/references/*.md",
    "resources/notebooks/*.ipynb",
]
