[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cisei-scenario-sdk"
version = "0.1.2"
description = "CISEI Scenario Builder SDK"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "tomlkit>=0.12",
    "PyYAML>=6.0",
    "pyproj",
]

[project.optional-dependencies]
openai = [
    "openai",
]
notebook = [
    "ipython",
    "ipywidgets",
    "pandas",
    "cisei-planning-sdk>=0.1.36,<0.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cisei_scenario_sdk = [
    "resources/references/*.md",
    "resources/notebooks/*.ipynb",
]
