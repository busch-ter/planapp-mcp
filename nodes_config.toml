
# ============================================================
# COPEL — CONFIGURAÇÃO DE PREPARAÇÃO DO NODES.CSV
# ============================================================
#
# CONFIGURAÇÃO EXPERIMENTAL — NÃO APROVADA PARA PLANEJAMENTO RF.
#
# As fontes originais em data/ são prioritárias.
# Este arquivo complementa os parâmetros não disponíveis
# diretamente nas fontes originais.
#
# Perfis, flags e alturas devem ser revisados antes do
# planejamento RF.
#
# ============================================================

[compiler]
adapter = "copel"
output = "nodes.csv"
source_crs = "EPSG:31982"

# Permite gerar identificadores sintéticos quando necessário.
allow_synthetic_site_ids = true

# Utiliza a altura da estrutura como altura de montagem.
use_structure_height_as_mount_height = true

# Altura provisória para subestações sem altura informada.
substation_zero_height_m = 10.0


# ============================================================
# SUBESTAÇÕES COPEL
# ============================================================

[substations]
kind = "cell"
device_profile = "lte_cell"

# Valores explícitos, provisórios para o cenário experimental.
connected = true
can_route = true


# ============================================================
# TORRES EXTERNAS
# ============================================================

[external_towers]
kind = "cell"
device_profile = "lte_cell"

# Valores explícitos, provisórios para o cenário experimental.
connected = true
can_route = true


# ============================================================
# EQUIPAMENTOS DE AUTOMAÇÃO
# ============================================================

[automation]
kind = "leaf"
device_profile = "lte_leaf"

# Valores explícitos, provisórios para o cenário experimental.
connected = false
can_route = false

# Altura provisória de montagem dos equipamentos.
mount_height_m = 7.0

# Tipos de equipamentos considerados pelo driver COPEL.
types = [
    "RA",
    "GM",
    "BRT_A",
    "GA",
    "RA_NOVO",
    "CO",
    "TS_A_SG",
    "OR",
    "OM",
    "FS_A_SG"
]
