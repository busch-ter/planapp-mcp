name: Build CISEI Scenario SDK

on:
  workflow_dispatch:
  push:
    paths:
      - "packages/cisei-scenario-sdk/**"
      - ".github/workflows/build-scenario-sdk.yml"

jobs:
  build:
    if: github.repository == 'cisei-pid/planapp-mcp'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Build wheel
        working-directory: packages/cisei-scenario-sdk
        run: python -m build --wheel

      - name: Validate wheel
        working-directory: packages/cisei-scenario-sdk
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels

          with ZipFile(wheels[0]) as z:
              names = set(z.namelist())

              prefix = (
                  "cisei_scenario_sdk/resources/"
                  "examples/copel_palmeira/"
              )

              expected = [
                  "nodes_config.toml",
                  "nodes_generated.csv",
                  "scenario_messages.txt",
                  "data/02.01 FASE_2_SUBESTACOES.CSV",
                  "data/03.01 FASE_2_TORRES_FORA_DE_SE.CSV",
                  "data/04.01 FASE_2_EQUIPAMENTOS_DE_AUTOMACAO.CSV",
              ]

              for name in expected:
                  assert prefix + name in names, name

              assert "cisei_scenario_sdk/example_projects.py" in names
              assert "cisei_scenario_sdk/notebook_app/app.py" in names

          print("Wheel validado:", wheels[0])
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: cisei-scenario-sdk-wheel
          path: packages/cisei-scenario-sdk/dist/*.whl
          if-no-files-found: error
